<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shelf Share - books by people Julie Trell knows and loves. A curated library of friends' books you can actually buy." />
  <meta property="og:title" content="Shelf Share - Julie Trell, Playful Purpose" />
  <meta property="og:description" content="Books by people I know and love. Click a spine." />
  <meta property="og:image" content="https://playfulpurpose.github.io/website-playfulpurpose/og-image.png" />
  <meta property="og:url" content="https://playfulpurpose.com/playing/shelf-life.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://playfulpurpose.github.io/website-playfulpurpose/og-image.png" />
  <title>Shelf Share - Playful Purpose</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #F7941D; --red: #E31E24; --lime: #8DC63F;
      --blue: #1B3A8C; --white: #FFFFFF; --offwhite: #F9F6F2;
      --text: #1a1a1a; --muted: #888; --wood: #b8864e;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--white); color: var(--text); }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
      padding: 1.25rem 5vw;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-logo-img { height: 52px; width: auto; }
    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-cta { background: var(--orange) !important; color: var(--white) !important; padding: 0.5rem 1.25rem; border-radius: 100px; font-weight: 800 !important; font-size: 0.875rem !important; }

    /* PAGE HEADER */
    .page-header {
      padding: 3rem 5vw 0;
      display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1.5rem;
    }
    .header-left {}
    .page-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); margin-bottom: 0.5rem; display: block; }
    .page-headline { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .page-headline span { color: var(--orange); }
    .page-count { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; }
    .header-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search-input {
      font-family: 'Poppins', sans-serif; font-size: 0.85rem;
      padding: 8px 14px; border: 2px solid #ddd; border-radius: 100px;
      width: 220px; color: var(--text); outline: none; transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--orange); }
    .sort-select {
      font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 700;
      padding: 8px 14px; border: 2px solid #ddd; border-radius: 100px;
      color: var(--text); background: var(--white); cursor: pointer; outline: none;
    }

    /* FILTERS */
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 1.5rem 5vw 0; }
    .filter-btn {
      font-size: 0.78rem; font-weight: 700; padding: 5px 14px;
      border-radius: 100px; border: 2px solid #ccc;
      background: var(--white); color: var(--muted);
      cursor: pointer; font-family: 'Poppins', sans-serif; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--orange); color: var(--orange); }
    .filter-btn.active { background: var(--orange); border-color: var(--orange); color: var(--white); }

    /* LIBRARY */
    .library { padding: 2rem 5vw 5rem; }

    /* SHELF */
    .shelf-wrap { margin-bottom: 8px; }
    .books-row { display: flex; align-items: flex-end; gap: 5px; min-height: 180px; flex-wrap: wrap; padding: 0 8px; }

    /* BOOK */
    .book { display: flex; cursor: pointer; transition: transform 0.2s ease; flex-shrink: 0; position: relative; }
    .book:hover { transform: translateY(-16px); }
    .book.hidden { display: none; }
    .book-spine {
      border-radius: 3px 0 0 3px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(0,0,0,0.4); border-right: none;
      position: relative; overflow: hidden;
    }
    .book-spine::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: rgba(255,255,255,0.25);
    }
    .book-pages {
      width: 10px;
      background: repeating-linear-gradient(to right, #f5ede0, #f5ede0 1px, #ede4d4 1px, #ede4d4 2px);
      border: 2px solid rgba(0,0,0,0.3); border-left: none;
      border-radius: 0 3px 3px 0;
    }
    .spine-text {
      writing-mode: vertical-rl; text-orientation: mixed;
      transform: rotate(180deg);
      font-size: 11px; font-weight: 800; color: #fff;
      text-align: center; padding: 10px 4px; line-height: 1.15;
      font-family: 'Poppins', sans-serif;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .spine-author { font-size: 8.5px; font-weight: 500; opacity: 0.88; display: block; margin-top: 6px; }

    /* SHELF PLANK */
    .shelf-plank { display: block; width: 100%; }

    /* EMPTY / NO RESULTS */
    .no-results { padding: 3rem; text-align: center; color: var(--muted); font-size: 0.95rem; }
    .end-of-shelf { text-align: center; color: #ccc; font-size: 0.8rem; letter-spacing: 0.1em; padding: 1.5rem 0 0; font-style: italic; }

    /* MODAL OVERLAY */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 14px;
      border: 3px solid #111; box-shadow: 6px 6px 0 #111;
      max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;
      position: relative; padding: 28px;
    }
    .modal-close {
      position: absolute; top: 14px; right: 18px;
      font-size: 1.6rem; font-weight: 900; cursor: pointer;
      background: none; border: none; color: #111;
      font-family: 'Poppins', sans-serif; line-height: 1;
    }
    .modal-close:hover { color: var(--orange); }
    .modal-inner { display: flex; gap: 22px; }
    .modal-cover {
      width: 110px; height: 158px; border-radius: 6px; flex-shrink: 0;
      object-fit: cover; border: 2px solid rgba(0,0,0,0.12);
    }
    .modal-cover-placeholder {
      width: 110px; height: 158px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff;
      text-align: center; padding: 10px; line-height: 1.3;
      border: 2px solid rgba(0,0,0,0.12);
    }
    .modal-info { flex: 1; min-width: 0; }
    .modal-julie-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--orange); margin-bottom: 6px; }
    .modal-title { font-size: 1.35rem; font-weight: 900; color: #111; letter-spacing: -0.02em; margin-bottom: 3px; line-height: 1.2; }
    .modal-author { font-size: 0.875rem; color: var(--muted); font-weight: 500; margin-bottom: 14px; }
    .modal-summary { font-size: 0.85rem; color: #444; line-height: 1.7; margin-bottom: 12px; font-style: italic; }
    .modal-note { font-size: 0.875rem; color: #333; line-height: 1.7; margin-bottom: 16px; padding-left: 12px; border-left: 3px solid var(--orange); }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .modal-tag { font-size: 0.7rem; font-weight: 700; padding: 3px 11px; border-radius: 100px; background: var(--offwhite); color: #555; border: 1.5px solid #e0e0e0; }
    .modal-buy {
      display: inline-block; background: var(--orange); color: #fff;
      border: 2.5px solid #111; padding: 11px 24px;
      border-radius: 8px; font-size: 0.875rem; font-weight: 900;
      cursor: pointer; font-family: 'Poppins', sans-serif;
      box-shadow: 4px 4px 0 #111; text-decoration: none; transition: all 0.15s;
    }
    .modal-buy:hover { box-shadow: 2px 2px 0 #111; transform: translate(2px, 2px); }

    /* COMMENT SECTION */
    .modal-comments { margin-top: 22px; border-top: 2px solid #f0f0f0; padding-top: 18px; }
    .comments-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #111; margin-bottom: 12px; }
    .comment-form { background: var(--offwhite); border-radius: 8px; padding: 14px; border: 2px solid #111; }
    .comment-form input, .comment-form textarea {
      display: block; width: 100%; margin-bottom: 8px;
      padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px;
      font-family: 'Poppins', sans-serif; font-size: 0.8rem; color: var(--text);
      background: #fff; transition: border 0.2s;
    }
    .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: var(--orange); }
    .comment-form textarea { height: 75px; resize: none; }
    .comment-submit {
      display: block; width: 100%;
      background: var(--blue); color: #fff;
      border: 2.5px solid #111; padding: 10px;
      border-radius: 6px; font-size: 0.85rem; font-weight: 900;
      cursor: pointer; font-family: 'Poppins', sans-serif;
      box-shadow: 3px 3px 0 #111; transition: all 0.15s;
    }
    .comment-submit:hover { box-shadow: 1px 1px 0 #111; transform: translate(2px, 2px); }

    /* FOOTER */
    footer { background: var(--blue); color: rgba(255,255,255,0.7); padding: 3rem 5vw; text-align: center; font-size: 0.85rem; }
    footer a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 1rem; }
    footer a:hover { color: #fff; }
    .footer-links { margin-bottom: 1rem; }

    @media (max-width: 600px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .modal-inner { flex-direction: column; }
      .modal-cover, .modal-cover-placeholder { width: 100%; height: 200px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">
    <img class="nav-logo-img" src="../og-image.png" alt="Playful Purpose" id="nav-logo" />
  </a>
  <ul class="nav-links">
    <li><a href="../index.html#what-i-do">What I Do</a></li>
    <li><a href="../index.html#about">About</a></li>
    <li><a href="../writing.html">Writing</a></li>
    <li><a href="../playing.html" class="active">Playing</a></li>
    <li><a href="../index.html#contact" class="nav-cta">Work With Me</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="header-left">
    <span class="page-label">The library</span>
    <h1 class="page-headline">Shelf <span>Share</span></h1>
    <p class="page-count" id="book-count">Books by people I know and love. Click a spine.</p>
  </div>
  <div class="header-right">
    <input class="search-input" type="text" id="search" placeholder="Search title, author, blurb..." />
    <select class="sort-select" id="sort-select">
      <option value="recent">Recently added</option>
      <option value="title">Title A-Z</option>
      <option value="author">Author A-Z</option>
    </select>
  </div>
</div>

<div class="filter-row" id="filter-row">
  <button class="filter-btn active" data-tag="All">All</button>
</div>

<div class="library" id="library">
  <p style="color:#aaa;padding:3rem 0;text-align:center;">Loading the shelves...</p>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-inner">
      <div id="modal-cover-wrap"></div>
      <div class="modal-info">
        <div class="modal-julie-tag">Julie's pick</div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-author" id="modal-author"></div>
        <p class="modal-summary" id="modal-summary"></p>
        <p class="modal-note" id="modal-note"></p>
        <div class="modal-tags" id="modal-tags"></div>
        <a class="modal-buy" id="modal-buy" href="#" target="_blank" rel="noopener">Buy it on Booktopia ↗</a>
      </div>
    </div>
    <div class="modal-comments">
      <div class="comments-title">Leave a thought</div>
      <div class="comment-form">
        <form id="comment-form" action="https://formspree.io/f/mzdlaryg" method="POST">
          <input type="hidden" name="book" id="comment-book-field" value="" />
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email (not shown publicly)" required />
          <textarea name="comment" placeholder="What did you think of the book?" required></textarea>
          <button type="submit" class="comment-submit">Submit ↗</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="https://playfulpurpose.substack.com" target="_blank">Substack</a>
    <a href="https://linkedin.com/in/julietrell" target="_blank">LinkedIn</a>
    <a href="mailto:julie@playfulpurpose.com">Email</a>
  </div>
  <div>Playful Purpose &copy; 2026 - Julie Trell</div>
</footer>

<script>
  const AIRTABLE_TOKEN = 'patkkBc7bwCkU8YEY.256b9f0d0a23a5e0fede387a1715bba4710c1ec28f93ecedeeaabd40acd9d292';
  const BASE_ID = 'appzVvO2Fzv8ly8yZ';

  const COLOUR_MAP = {
    'orange': '#F7941D', 'red': '#E31E24', 'green': '#8DC63F', 'lime': '#8DC63F',
    'blue': '#1B3A8C', 'purple': '#9B59B6', 'yellow': '#E6B800', 'pink': '#E91E8C',
    'teal': '#00897B', 'navy': '#1B3A8C', 'coral': '#E05A4E', 'magenta': '#C2185B'
  };

  const HEIGHTS = [145, 160, 132, 168, 150, 138, 155, 142, 125, 162, 148, 135];
  const WIDTHS  = [48, 54, 44, 58, 50, 46, 52, 56, 44, 54, 48, 50];

  let allBooks = [];
  let activeTag = 'All';
  let searchTerm = '';
  let sortBy = 'recent';

  function colour(val) {
    if (!val) return '#8DC63F';
    const v = val.trim();
    if (v.startsWith('#')) return v;
    return COLOUR_MAP[v.toLowerCase()] || '#8DC63F';
  }

  async function loadBooks() {
    try {
      const url = `https://api.airtable.com/v0/${BASE_ID}/Books?filterByFormula=NOT({Title}='')&sort[0][field]=Row&sort[0][direction]=asc`;
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` } });
      const data = await res.json();
      allBooks = (data.records || []).map((r, i) => ({
        id: r.id,
        title: r.fields['Title'] || '',
        author: r.fields['Author'] || '',
        note: r.fields["Julie's Note"] || r.fields["Julie's note"] || '',
        summary: r.fields['Summary'] || '',
        spineColour: colour(r.fields['Spine Colour'] || r.fields['Spine colour'] || ''),
        tags: r.fields['Tags'] || [],
        buyLink: r.fields['Buy Link'] || r.fields['Buy link'] || '#',
        cover: r.fields['Cover Image'] ? r.fields['Cover Image'][0].url : null,
        row: r.fields['Row'] || 1,
        createdTime: r.createdTime,
        h: HEIGHTS[i % HEIGHTS.length],
        w: WIDTHS[i % WIDTHS.length]
      }));
      buildFilters();
      render();
    } catch(e) {
      document.getElementById('library').innerHTML = '<p class="no-results">Couldn\'t load the shelves right now. Try refreshing.</p>';
    }
  }

  function buildFilters() {
    const tags = new Set();
    allBooks.forEach(b => b.tags.forEach(t => tags.add(t)));
    const row = document.getElementById('filter-row');
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'; btn.dataset.tag = tag; btn.textContent = tag;
      btn.addEventListener('click', () => { activeTag = tag; updateFilters(); render(); });
      row.appendChild(btn);
    });
    document.querySelector('[data-tag="All"]').addEventListener('click', () => { activeTag = 'All'; updateFilters(); render(); });
  }

  function updateFilters() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === activeTag));
  }

  function filtered() {
    let books = [...allBooks];
    if (activeTag !== 'All') books = books.filter(b => b.tags.includes(activeTag));
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      books = books.filter(b =>
        b.title.toLowerCase().includes(s) ||
        b.author.toLowerCase().includes(s) ||
        b.summary.toLowerCase().includes(s) ||
        b.note.toLowerCase().includes(s)
      );
    }
    if (sortBy === 'title') books.sort((a,b) => a.title.localeCompare(b.title));
    else if (sortBy === 'author') books.sort((a,b) => a.author.localeCompare(b.author));
    else books.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime));
    return books;
  }

  function render() {
    const books = filtered();
    const lib = document.getElementById('library');
    document.getElementById('book-count').textContent = `${books.length} book${books.length !== 1 ? 's' : ''} by people I know and love`;

    if (!books.length) {
      lib.innerHTML = '<p class="no-results">No books match that search. Try something else.</p>';
      return;
    }

    const SHELF_SIZE = 10;
    const shelves = [];
    for (let i = 0; i < books.length; i += SHELF_SIZE) shelves.push(books.slice(i, i + SHELF_SIZE));

    lib.innerHTML = shelves.map((shelf, si) => `
      <div class="shelf-wrap">
        <div class="books-row">
          ${shelf.map(b => `
            <div class="book" id="book-${b.id}" data-id="${b.id}" onclick="openModal('${b.id}')">
              <div class="book-spine" style="width:${b.w}px;height:${b.h}px;background:${b.spineColour};">
                <div class="spine-text">${b.title}<span class="spine-author">${b.author.split(' ').slice(-1)[0]}</span></div>
              </div>
              <div class="book-pages" style="height:${b.h}px;"></div>
            </div>
          `).join('')}
        </div>
        <svg class="shelf-plank" viewBox="0 0 1000 20" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;">
          <path d="M0,5 C150,3 300,9 500,5 C700,1 850,8 1000,5 L1000,16 C850,17 700,13 500,16 C300,18 150,14 0,16 Z" fill="#c8a96e" stroke="#111" stroke-width="2.5"/>
          <path d="M0,5 C150,3 300,9 500,5 C700,1 850,8 1000,5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        </svg>
      </div>
    `).join('') + '<div class="end-of-shelf">- end of shelf -</div>';
  }

  function openModal(id) {
    const b = allBooks.find(b => b.id === id);
    if (!b) return;

    document.getElementById('modal-cover-wrap').innerHTML = b.cover
      ? `<img class="modal-cover" src="${b.cover}" alt="${b.title}" />`
      : `<div class="modal-cover-placeholder" style="background:${b.spineColour}">${b.title}</div>`;

    document.getElementById('modal-title').textContent = b.title;
    document.getElementById('modal-author').textContent = 'by ' + b.author;
    document.getElementById('modal-summary').textContent = b.summary || '';
    document.getElementById('modal-summary').style.display = b.summary ? 'block' : 'none';
    document.getElementById('modal-note').textContent = b.note ? '"' + b.note + '"' : '';
    document.getElementById('modal-note').style.display = b.note ? 'block' : 'none';
    document.getElementById('modal-tags').innerHTML = b.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
    document.getElementById('modal-buy').href = b.buyLink || '#';
    document.getElementById('comment-book-field').value = b.title;

    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value; render();
  });

  document.getElementById('sort-select').addEventListener('change', e => {
    sortBy = e.target.value; render();
  });

  // Load nav logo from parent index
  fetch('../index.html').then(r => r.text()).then(html => {
    const match = html.match(/src="(data:image\/png;base64,[^"]+)"/);
    if (match) document.getElementById('nav-logo').src = match[1];
  }).catch(() => {});

  loadBooks();
</script>
</body>
</html>
