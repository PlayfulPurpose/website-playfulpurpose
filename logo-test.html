<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Logo scroll test</title>
  <style>
    body { font-family: sans-serif; background: #F9F6F2; padding: 4rem 0; }
    p { text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 2rem; letter-spacing: 0.1em; text-transform: uppercase; }

    .marquee-wrap {
      overflow: hidden;
      width: 100%;
      position: relative;
    }
    .marquee-wrap::before,
    .marquee-wrap::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 80px;
      z-index: 2;
      pointer-events: none;
    }
    .marquee-wrap::before { left: 0; background: linear-gradient(to right, #F9F6F2, transparent); }
    .marquee-wrap::after  { right: 0; background: linear-gradient(to left, #F9F6F2, transparent); }

    .marquee-track {
      display: flex;
      align-items: flex-start;
      gap: 4rem;
      width: max-content;
      animation: scroll 65s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .logo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .logo-item img,
    .logo-item svg {
      height: 40px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      filter: grayscale(100%);
      opacity: 0.55;
      transition: opacity 0.2s, filter 0.2s;
    }
    .logo-item:hover img,
    .logo-item:hover svg {
      filter: grayscale(0%);
      opacity: 1;
    }
    .logo-name {
      font-family: 'Poppins', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #aaa;
      text-align: center;
      max-width: 120px;
    }
  </style>
</head>
<body>
  <p>Trusted by teams at</p>
  <div class="marquee-wrap">
    <div class="marquee-track" id="track"></div>
  </div>

  <script>
    const logos = [
      { file: "ANZ-Logo.png",                          name: "ANZ" },
      { file: "csiro.png",                              name: "CSIRO" },
      { file: "university-of-sydney.png",               name: "University of Sydney" },
      { file: "paramount.png",                          name: "Paramount Training & Development" },
      { file: "disruptors.png",                         name: "Disruptors Co" },
      { file: "indigital_logo.png",                     name: "InDigital" },
      { file: "Insight_Enterprises_Logo.png",           name: "Insight" },
      { file: "courage-to-care.png",                    name: "Courage to Care" },
      { file: "parlaimentary-library.png",              name: "Parliamentary Library" },
      { file: "atomic_tangerine_australia_logo.png",    name: "Atomic Tangerine" },
      { file: "TRwlogo.png",                            name: "Tech Ready Women" },
      { file: "i2n.png",                                name: "i2n" },
      { file: "press-play-ventures--white.png",         name: "Press Play Ventures" },
      { file: "infoxchange.svg",                        name: "Infoxchange" },
      { file: "forumspace.png",                         name: "Forum Space" },
      { file: "coralus.png",                            name: "Coralus" },
      { file: "Ibvoght.svg",                            name: "Ibvoght" },
    ];

    const track = document.getElementById('track');

    function makeItem({ file, name }) {
      const div = document.createElement('div');
      div.className = 'logo-item';
      const img = document.createElement('img');
      img.src = `client-logos/${encodeURIComponent(file)}`;
      img.alt = name;
      const label = document.createElement('span');
      label.className = 'logo-name';
      label.textContent = name;
      div.appendChild(img);
      div.appendChild(label);
      return div;
    }

    // Double the logos so the loop is seamless
    [...logos, ...logos].forEach(logo => {
      track.appendChild(makeItem(logo));
    });
  </script>
</body>
</html>
