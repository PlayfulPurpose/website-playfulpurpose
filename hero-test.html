<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hero test – Playful Purpose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #111;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('swing-with-water.jpg');
      background-size: cover;
      background-position: center 30%;
      z-index: 0;
    }

    /* subtle dark tint so card pops but image still reads */
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
    }

    /* ── CARD ── */
    .hero-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      max-width: 520px;
      margin-left: clamp(2rem, 8vw, 8rem);
      box-shadow: 0 24px 60px rgba(0,0,0,0.22);
    }

    .hero-eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #F7941D;
      margin-bottom: 1.25rem;
    }

    .hero-headline {
      font-size: clamp(2.4rem, 5vw, 3.75rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.03em;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
    }

    .spinning-word {
      display: inline-block;
      color: #F7941D;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .spinning-word.exit    { opacity: 0; transform: translateY(-12px); }
    .spinning-word.enter   { opacity: 0; transform: translateY(12px); }
    .spinning-word.visible { opacity: 1; transform: translateY(0); }

    .logo-dot { color: #FFD258; font-weight: 900; }

    .hero-sub {
      font-size: 1rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 2rem;
      max-width: 42ch;
    }

    .btn-primary {
      display: inline-block;
      background: #F7941D;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 100px;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-primary:hover { background: #E31E24; transform: translateY(-1px); }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      .hero { min-height: 100svh; align-items: flex-end; padding-bottom: 3rem; }
      .hero-bg { background-position: 70% center; }
      .hero-card {
        margin: 0 1rem;
        padding: 2rem 1.75rem;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-card">
      <p class="hero-eyebrow">Julie Trell — Chief Play Officer</p>
      <h1 class="hero-headline">
        The future<br>of work is<br>
        <span class="spinning-word visible" id="spinner">play</span><span class="logo-dot">.</span>
      </h1>
      <p class="hero-sub">
        I help people stay human in an AI world — building the connection, creativity, and relationships that technology can't replace.
      </p>
      <a href="https://calendly.com/playfulpurpose" target="_blank" class="btn-primary">Let's talk</a>
    </div>
  </section>

  <script>
    const words  = ['human', 'improvised', 'connected', 'curious', 'yours', 'play'];
    const colors = ['#E31E24', '#8DC63F', '#F7941D', '#E31E24', '#8DC63F', '#F7941D'];
    let current  = 0;
    const spinner = document.getElementById('spinner');

    function nextWord() {
      spinner.classList.remove('visible');
      spinner.classList.add('exit');
      setTimeout(() => {
        current = (current + 1) % words.length;
        spinner.textContent = words[current];
        spinner.style.color  = colors[current];
        spinner.classList.remove('exit');
        spinner.classList.add('enter');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          spinner.classList.remove('enter');
          spinner.classList.add('visible');
        }));
      }, 350);
    }

    setInterval(nextWord, 2200);
  </script>

</body>
</html>
